name: Push to ECR                                                           # 해당 작업의 이름
on:                                                                         # 언제 작업을 시작하는지
  workflow_dispatch:                                                        # 사람이 눌러도 실행되게
  push:                                                                     # 푸시될 때
    branches:                                                               # 어떤 브랜치에 푸시 될 때인지
      - main                                                                # main 브랜치에 푸시 될 때 해당 작업 실행
    paths:                                                                  # 이 목록 중 하나라도 파일의 변경이 있으면
    - Dockerfile                                                            # Dockerfile
    - src/**                                                                # 내부 소스코드
    - pyproject.toml                                                        # 프로젝트 정보와 의존성 파일
    - uv.lock                                                               # 설치되는 라이브러리의 실제 버전이 담긴 파일
jobs:                                                                       # 실제로 동작하는 동작
  test:                                                                     # test 라는 이름의 동작 방식을 정의
    runs-on: ubuntu-latest                                                  # ubuntu를 잠시 빌려서 실행
    steps:                                                                  # 위에서부터 실행될 단계를 작성함
      - uses: actions/checkout@v7                                           # 저장소의 코드 (최근 커밋 건)를 비어있는 컴퓨터에 다운로드함 (커밋 번호 찾기나 임시 권한 등이 자동으로 들어감) git clone을 쓰면 이런 것들을 수동으로 해줘야 함
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d   # 빌린 컴퓨터에 uv 설치
      - run: uv sync --locked                                               # uv.lock의 내용대로 의존성을 설치하되, pyproject.toml과 내용이 다르면 멈춘다.
      - run: uv run pytest                                                  # 테스트를 거쳐서 성공해야 정상적으로 끝까지 동작한다
        env:                                                                # uv run pytest 실행 시, 적용할 환경변수
          OK_MESSAGE: ok                                                    # 현재 /health 테스트 시에 ok가 반환되야 정상적으로 테스트가 통과하므로
  build-and-push:                                                           # build 후 push 동작을 정의
      needs: test                                                           # test job이 성공적으로 완료된 후 동작함
      runs-on: ubuntu-latest                                                # ubuntu를 잠시 빌려서 실행 (test job의 컴퓨터와 다른 컴퓨터임)
      steps:                                                                # 실행할 단계를 정의
        - uses: actions/checkout@v7                                         # 저장소 코드 다운로드
        - uses: aws-actions/configure-aws-credentials@v6                    # 빌린 컴퓨터에서 AWS 권한을 사용할 수 있도록 하는 액션
          with:                                                             # 위 액션이 실행되는데 필요한 값을 정의
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ap-northeast-2
        - id: ecr                                                           # 단계에 이름을 붙임. ecr에서 값을 받아 다른 곳에서 사용하기 위한 식별자로 사용한다
          uses: aws-actions/amazon-ecr-login@v2                             # ecr login action
        - name: build and push                                              # 나중에 식별하기 위해 이름을 붙임 (어디에서 실패했는지 보기 편하게)
          env:                                                              # ecr에서 반환하는 ecr 주소와 terraform에서 생성한 ecr 이름을 조합 
            ECR_REPO: ${{ steps.ecr.outputs.registry }}/llmops-tutor-repository
            TAG: ${{ github.sha }}                                          # 이번 실행을 일으킨 커밋 번호 (이것을 자동화 하기 위해 해당 ci/cd를 만듦)
          run: |                                                            # 아래의 여러 줄을 한 줄씩 차례로 실행하라는 명령어 (루트 경로의 Dockerfile을 활용해 REPO:TAG 명으로 이미지를 만들고, 그 이름의 이미지를 ecr에 Push)
            docker build -t $ECR_REPO:$TAG --provenance=false .
            docker push $ECR_REPO:$TAG
          
        
  
    
